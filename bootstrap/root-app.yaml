## Raiz del patron app-of-apps (Practica 9). UNICO manifiesto que
## Terraform aplica a mano (P9/terraform/bootstrap-app.tf); todo lo
## demas listado abajo lo sincroniza ArgoCD solo.
##
## Se publica en su PROPIA carpeta "bootstrap/" -- nunca dentro de
## "argocd/" (que es justo lo que este recurso administra: si viviera
## ahi, ArgoCD intentaria hacer prune de su propia Application en cada
## sync) NI en la raiz del repo (como se intento al principio): la raiz
## tambien esta descartada porque application-dev.yaml/application-prod.yaml
## usan un segundo source con `path: "."` + `ref: values` sobre ESTE
## MISMO repo para resolver los values files -- ArgoCD igual escanea esa
## ruta en busca de manifiestos aunque solo se use como referencia de
## values, así que cualquier YAML en la raiz (incluido este) terminaba
## evaluado tambien como parte del sync de sa-platform-dev/prod, y
## rechazado por el AppProject "sa-platform" (namespace "argocd" no esta
## en su lista de destinos permitidos). "bootstrap/" no lo escanea nada
## mas en todo el repo.
##
## project: default (no "sa-platform"): este recurso lo aplica
## Terraform ANTES de que exista el AppProject "sa-platform" -- que se
## crea recien cuando el propio Sync de este root app aplica
## argocd/project.yaml. Usar el proyecto "default" (siempre existe en
## cualquier instalacion de ArgoCD) evita esa dependencia circular. Las
## 5 Application hijas si declaran `project: sa-platform` (heredado sin
## cambios de Practica 8) y quedan acotadas a lo que ese AppProject
## permite -- este root app es el UNICO recurso de la practica con
## alcance sin restringir, y su unico trabajo es aplicar los 6 archivos
## de "argocd/", nada mas.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-platform-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/AlejandroPA21/sa-platform-gitops.git"
    targetRevision: main
    path: argocd
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
