## values-images-dev.yaml -- UNICO archivo que edita el Pull Request
## automatico del pipeline para el ambiente dev (job "open-gitops-pr" en
## .github/workflows/p8-gitops-ci.yml, via `yq eval -i
## '.<servicio>.image.tag = "<TAG>"'`). El tag es siempre el nombre exacto
## del release de Git que disparo el build (vX.Y.Z) -- nunca "latest"
## (prohibido ademas por Kyverno, ver gitops/policies/kyverno/disallow-latest-tag.yaml).
##
## repository SI incluye el registry completo (ghcr.io/<owner>/<repo>/<svc>,
## todo en minusculas) en vez de depender de global.imageRegistry: la
## Practica 6 (docs/VALIDACION_LOCAL.md §2) ya documento por que un
## global.imageRegistry unico rompe las imagenes de PostgreSQL/RabbitMQ de
## Bitnami -- se mantiene el mismo patron aqui.
##
## Version inicial (placeholder): sustituye "v0.1.0" por el primer tag
## real que publiques (ver docs/GUIA_INSTALACION_CLUSTER.md paso 6).
