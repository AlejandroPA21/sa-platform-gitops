## ClusterAnalysisTemplate "smoke-test" -- primera y tercera puerta de
## promocion de TODOS los Rollout de la plataforma (ver el bloque
## `strategy.canary.steps` en cada P5/charts/sa-platform/charts/<svc>/templates/rollout.yaml).
## Cluster-scoped (no AnalysisTemplate namespaced) a proposito: se define
## una sola vez y la referencian los Rollout tanto de sa-p8-dev como de
## sa-p8-prod (`clusterScope: true` en cada referencia), sin duplicarla
## por ambiente.
##
## Que valida: que los pods CANARY (nunca los estables -- por eso apunta
## al Service "<svc>-canary", nunca al Service principal que mezcla
## ambos) respondan 200 en su endpoint de salud, 5 veces seguidas con 2s
## de espera entre intentos. Threshold binario (todo o nada) porque un
## smoke test no mide grados: o el proceso arranco sano detras del nuevo
## tag de imagen, o no.
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: smoke-test
spec:
  args:
    - name: canary-service
    - name: service-port
    - name: health-path
  metrics:
    - name: smoke-http-200
      # 5 intentos, sin reintento automatico del propio AnalysisRun
      # (count: 1): la resiliencia YA la da el bucle `for` dentro del Job.
      # Si el Job termina con exit distinto de 0, Argo Rollouts marca el
      # AnalysisRun "Failed" y ABORTA el rollout -- reversion automatica al
      # 100% de trafico estable, sin intervencion humana (ver
      # P8/docs/ARQUITECTURA_GITOPS.md, diagrama de secuencia).
      #
      # Practica 8: initialDelay evita una carrera real observada en la
      # demo -- Argo Rollouts dispara este Job justo al fijar el nuevo
      # weight, sin esperar a que el pod canary recien creado termine de
      # arrancar. Sin este respiro, el primer intento del bucle de abajo
      # puede caer en el pod todavia "ContainerCreating"/sin pasar su
      # readinessProbe, cuenta como 1 fallo, y con failureLimit=0 (umbral
      # binario, a proposito) eso aborta el rollout aunque el canario este
      # sano un instante despues.
      initialDelay: 15s
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 60
            template:
              spec:
                restartPolicy: Never
                # Practica 8: sin esto, el propio Job de analisis viola las
                # politicas "require-resource-limits"/"require-run-as-non-root"
                # (aplican a TODO Pod en sa-p8-dev/prod, incluidos los Jobs que
                # el canario usa para validarse a si mismo) y Kyverno lo
                # rechaza -- el AnalysisRun nunca llega a probar el canary, se
                # queda en "Error" (5 errores de admision consecutivos) y
                # Argo Rollouts aborta como si el canary hubiera fallado de
                # verdad. curlimages/curl ya corre como UID no-root (100) por
                # defecto en su propia imagen.
                securityContext:
                  runAsNonRoot: true
                containers:
                  - name: smoke-test
                    image: curlimages/curl:8.10.1
                    command: ["sh", "-c"]
                    resources:
                      requests:
                        cpu: "25m"
                        memory: "32Mi"
                      limits:
                        cpu: "100m"
                        memory: "64Mi"
                    args:
                      - |
                        set -eu
                        URL="http://{{args.canary-service}}:{{args.service-port}}{{args.health-path}}"
                        echo "Probing canary: $URL"
                        i=1
                        while [ "$i" -le 5 ]; do
                          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$URL" || echo "000")
                          echo "intento $i -> HTTP $code"
                          if [ "$code" != "200" ]; then
                            echo "FALLO: se esperaba HTTP 200, se obtuvo $code"
                            exit 1
                          fi
                          i=$((i + 1))
                          sleep 2
                        done
                        echo "OK: 5/5 respuestas HTTP 200 del canary"
