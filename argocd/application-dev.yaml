## Application "dev": UNICO recurso que ArgoCD reconcilia contra
## sa-p8-dev. Fuente multiple (ArgoCD >= 2.6): el CHART sigue viviendo en
## el repo de codigo (P5/charts/sa-platform, sin duplicarlo -- mismo
## principio que ya aplicaron P6/P7), pero los VALUES que cambian por
## despliegue (tag de imagen, rollout on/off) vienen del repo de
## manifiestos INDEPENDIENTE, referenciado como "$values". El pipeline de
## CI (.github/workflows/p8-gitops-ci.yml) SOLO edita archivos dentro de
## gitops/values/ del segundo repo -- nunca toca el repo de codigo ni
## ejecuta un solo comando contra este cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-platform-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sa-platform
  sources:
    - repoURL: "https://github.com/AlejandroPA21/Practicas-SA-B-202200329.git"
      # Rama estable del repo de codigo. El TAG de cada imagen (que si
      # cambia por release) llega via el segundo source, nunca cambiando
      # este targetRevision -- el chart en si evoluciona mucho mas lento
      # que las versiones de imagen que despliega.
      targetRevision: main
      path: P5/charts/sa-platform
      helm:
        # Fijo (no el default de ArgoCD, que usaria el nombre de la
        # Application, "sa-platform-dev"): los 10 Secret del chart
        # (templates/secret*.yaml) y sus SealedSecret equivalentes
        # (gitops/secrets/) hardcodean nombres de host derivados de
        # {{ .Release.Name }} (ej. "sa-platform-postgresql"). Cambiar el
        # release name rompe esas referencias.
        releaseName: sa-platform
        valueFiles:
          # Del PROPIO repo de codigo (valores base del ambiente, ya
          # existentes desde P5 -- replicas/recursos "chicos" de dev).
          - values-dev.yaml
          # Del repo de MANIFIESTOS ($values, ver el 2do source abajo):
          # el pipeline solo escribe/edita este archivo.
          - $values/values/values-images-dev.yaml
          - $values/values/values-rollout.yaml
          # Ultimo (gana sobre replicaCount/autoscaling de arriba):
          # ajuste de capacidad especifico de este cluster, ver el
          # comentario en el propio archivo.
          - $values/values/values-capacity-dev.yaml
          # Practica 9: opt-in de respaldo de Velero para el volumen de
          # PostgreSQL (clave nueva, "postgresql.primary.podAnnotations",
          # no pisa nada de los archivos anteriores). Ver
          # P9/gitops/values/values-resilience-dev.yaml.
          - $values/values/values-resilience-dev.yaml
    - repoURL: "https://github.com/AlejandroPA21/sa-platform-gitops.git"
      targetRevision: main
      # Practica 9: SIN "path" (antes tenia 'path: "."'). Un source cuyo
      # unico proposito es servir de referencia de values ($values/...
      # arriba) no debe declarar ademas un path real -- con 'path: "."'
      # ArgoCD seguia escaneando la raiz del repo como un source de
      # manifiestos valido por derecho propio, y cualquier YAML ahi
      # (ej. el root-app.yaml que P9 agrego) se colaba en el plan de
      # sync de ESTA Application, siendo rechazado por el AppProject
      # "sa-platform" (namespace "argocd" no es un destino permitido).
      # Ver P9/docs/DECISIONES-P9.md seccion 11.
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8-dev
  # Practica 8: el HPA de cada servicio (autoscaling.minReplicas/maxReplicas,
  # ver P5/charts/.../values.yaml) ajusta spec.replicas del Rollout por su
  # cuenta -- sin esto, ArgoCD compara ese campo contra el valor estatico
  # de git y queda "OutOfSync" para siempre, aunque el sync haya
  # funcionado perfecto (loop: sync -> HPA lo cambia -> OutOfSync otra vez).
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
        # El CRD de Argo Rollouts instalado tiene un schema incompleto
        # para spec.template.metadata.annotations -- Kubernetes las
        # descarta silenciosamente al guardar el objeto (confirmado via
        # el Diff de la UI de ArgoCD), por lo que checksum/config y
        # checksum/secret nunca llegan a existir en el objeto vivo aunque
        # el chart si las declare. Efecto real (no solo cosmetico): un
        # cambio de ConfigMap/Secret SIN cambiar el tag de imagen no
        # reinicia el pod solo, a diferencia de P5 con Deployment. Ver
        # docs/ARQUITECTURA_GITOPS.md, "Limitaciones conocidas".
        - /spec/template/metadata/annotations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # false a proposito: el namespace lo crea UNICAMENTE Terraform (con
      # su ResourceQuota/LimitRange/RBAC ya aplicados) -- si ArgoCD pudiera
      # crearlo, un Sync antes de `terraform apply` produciria un
      # namespace sin cuotas ni RBAC durante esa ventana.
      - CreateNamespace=false
      # Practica 8: NO ServerSideApply=true -- el CRD Rollout de Argo
      # Rollouts no publica un schema OpenAPI completo para
      # spec.template.metadata.annotations, y el apply tipado/server-side
      # de Kubernetes es estricto con eso ("field not declared in
      # schema"). El apply "clasico" (3-way merge por
      # last-applied-configuration) no tiene ese problema.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
