## Application separada (tipo "directory", sin Helm) SOLO para los
## SealedSecret de sa-p8-dev (ver P8/docs/GUIA_INSTALACION_CLUSTER.md
## pasos 9-11). Separada de
## sa-platform-dev a proposito: esta Application NUNCA usa prune=true --
## un SealedSecret que deje de aparecer en un `helm template` puntual
## (por un cambio de rama, por ejemplo) no debe borrarse solo, porque
## borrar un Secret con datos reales es mucho mas peligroso que dejar uno
## de mas.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-platform-secrets-dev
  namespace: argocd
  annotations:
    # Sync wave negativa: se aplica ANTES que sa-platform-dev (wave 0 por
    # default), para que el Secret real ya exista cuando el primer Pod
    # arranca.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: sa-platform
  source:
    repoURL: "https://github.com/AlejandroPA21/sa-platform-gitops.git"
    targetRevision: main
    # Relativo a la RAIZ del repo de manifiestos -- lo que en este repo de
    # codigo esta en P8/gitops/secrets/ se publica en la raiz de
    # sa-platform-gitops como secrets/ (ver
    # P8/docs/GUIA_INSTALACION_CLUSTER.md paso 7).
    path: secrets
    directory:
      include: "*.sa-p8-dev.sealed.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8-dev
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
